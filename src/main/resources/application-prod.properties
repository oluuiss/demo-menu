# ---------------------------------------------------------------
# Production profile (Render + Neon Postgres)
# Activate with SPRING_PROFILES_ACTIVE=prod and set DATABASE_URL to the Neon connection string
# (postgresql://user:password@host/database?sslmode=require). See DatabaseUrlEnvironmentPostProcessor.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Render provides the port to listen on
server.port=${PORT:8080}

# Small pool: one long-running instance, Neon free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Neon scales to zero when idle; give the first connection time to wake it up
spring.datasource.hikari.connection-timeout=30000

# Behind HTTPS (Vercel proxies /api to this service)
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
