spring.application.name=demo-sneakhouse

# ---------------------------------------------------------------
# Local development database (H2, file based)
# Created automatically in ./data on first start. Delete the folder to reset.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/brasa-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Load lazy/eager collections (menu translations, order lines...) in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# Web console for inspecting the local DB: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# i18n: API messages in pt-BR (default), en and de, chosen by Accept-Language
# ---------------------------------------------------------------
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# ---------------------------------------------------------------
# Session cookie used by the auth API
# ---------------------------------------------------------------
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------------------------------------------------------------
# Demo account seeded on startup (password is stored as a BCrypt hash)
# ---------------------------------------------------------------
app.demo-user.email=usuario@demo
app.demo-user.password=usuario

# ---------------------------------------------------------------
# Cart pricing
# ---------------------------------------------------------------
app.pricing.delivery-fee=9.90
app.pricing.free-delivery-threshold=150.00
app.pricing.max-quantity-per-item=20

# ---------------------------------------------------------------
# Orders: automatic status transitions after payment
# ---------------------------------------------------------------
app.orders.awaiting-confirmation=10s
app.orders.preparing=5m
app.orders.out-for-delivery=5m
app.delivery.address=S\u00e3o Paulo - SP
app.orders.sync-interval=5s

# ---------------------------------------------------------------
# Reservations (fictional restaurant)
# ---------------------------------------------------------------
app.restaurant.name=Brasa Grill Paulista
app.restaurant.address=Av. Paulista, 1500 - Bela Vista
app.restaurant.city=S\u00e3o Paulo - SP
app.restaurant.phone=+55 11 94784-9239
app.restaurant.latitude=-23.5614
app.restaurant.longitude=-46.6559
app.restaurant.opening=12:00
app.restaurant.last-seating=22:30
app.restaurant.slot-interval=30m
app.restaurant.table-turnover=2h
app.restaurant.max-party-size=6
app.restaurant.booking-window-days=30
app.restaurant.simulated-occupancy-percent=30
